plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
    id 'org.jetbrains.kotlin.kapt'
}

android {
    namespace 'com.liuma.app'
    compileSdk 35

    defaultConfig {
        applicationId 'com.liuma.app'
        minSdk 29
        targetSdk 35
        versionCode 12
        versionName "3.1.0"

        ndk {
            abiFilters 'arm64-v8a', 'armeabi-v7a'
        }
    }

    signingConfigs {
        release {
            def keystoreFile = System.getenv("KEYSTORE_FILE")
            if (keystoreFile != null && file(keystoreFile).exists()) {
                storeFile file(keystoreFile)
                storePassword System.getenv("STORE_PASSWORD")
                keyAlias System.getenv("KEY_ALIAS")
                keyPassword System.getenv("KEY_PASSWORD")
            }
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = '17'
    }

    buildFeatures {
        buildConfig true
    }

    buildTypes {
        debug {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            // ADB 辅助功能开关：true=开启绕过安全限制，false=标准模式
            buildConfigField 'boolean', 'ENABLE_ADB_ASSIST_BYPASS', 'true'
        }

        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            // ADB 辅助功能开关：默认关闭，可通过命令行参数 -PenableAdbBypass=true 覆盖
            buildConfigField 'boolean', 'ENABLE_ADB_ASSIST_BYPASS', rootProject.ext.enableAdbBypass ? 'true' : 'false'

            def keystoreFile = System.getenv("KEYSTORE_FILE")
            if (keystoreFile != null && file(keystoreFile).exists()) {
                signingConfig signingConfigs.release
            } else {
                println("Release build without signing (keystore missing)")
            }
        }
    }

    lint {
        abortOnError false
        checkReleaseBuilds false
    }
}

dependencies {
    // Kotlin
    implementation 'org.jetbrains.kotlin:kotlin-stdlib:2.3.0'
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.9.0'
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-core:1.9.0'

    // AndroidX
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation ('io.socket:socket.io-client:2.1.0') {
        exclude group: 'org.json', module: 'json'
    }
    implementation 'androidx.core:core:1.16.0'
    implementation 'androidx.activity:activity:1.10.0'
    implementation 'androidx.work:work-runtime:2.10.0'
    implementation 'androidx.camera:camera-core:1.4.2'
    implementation 'androidx.camera:camera-camera2:1.4.2'
    implementation 'androidx.camera:camera-lifecycle:1.4.2'

    // Play Services
    implementation 'com.google.android.gms:play-services-location:21.4.0'

    // WebRTC
    implementation 'io.github.webrtc-sdk:android:125.6422.06'

    // Room (local cache for offline GPS data)
    implementation 'androidx.room:room-runtime:2.8.4'
    implementation 'androidx.room:room-ktx:2.8.4'
    kapt 'androidx.room:room-compiler:2.8.4'

    // Retrofit + Gson (HTTP networking)
    implementation 'com.squareup.retrofit2:retrofit:2.12.0'
    implementation 'com.squareup.retrofit2:converter-gson:2.12.0'
    implementation 'com.squareup.okhttp3:okhttp:4.12.0'
    implementation 'com.squareup.okhttp3:logging-interceptor:4.12.0'
    implementation 'com.google.code.gson:gson:2.12.0'

    // DataStore
    implementation 'androidx.datastore:datastore-preferences:1.1.2'

    // Google ML Kit OCR (本地文字识别)
    implementation 'com.google.mlkit:text-recognition:16.0.1'
}
